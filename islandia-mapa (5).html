  /* ---------- fotos ----------
   Vienen de Wikipedia / Wikimedia Commons, que tienen licencia libre, y se piden
   desde el navegador al abrir cada día. No van incrustadas en el archivo: sin red
   simplemente no aparecen, y el resto del mapa funciona igual.
   Se pide una tanda por día con los títulos exactos; los que no resuelven caen a
   una búsqueda por nombre. */
const PH = {};                       // nombre de parada -> {src, page} | null
const WAPI = 'https://en.wikipedia.org/w/api.php';

function stopsOf(d){
  // incluye los alojamientos del día: son el arranque y el cierre del recorrido
  // y también se navegan con las flechas.
  const bases = d.route.filter(s => s.base!==undefined).map(s => BASES[s.base]);
  return d.route.filter(s => s.base===undefined).concat(d.extras || [], bases);
}

async function wq(params){
  const u = WAPI + '?' + new URLSearchParams(
    Object.assign({action:'query', format:'json', origin:'*'}, params));
  const r = await fetch(u);
  return r.json();
}

function harvest(j){
  const q = j.query || {}, pages = q.pages || {};
  // Wikipedia devuelve el título final; hay que rastrear normalizaciones y
  // redirecciones para volver al título que pedimos.
  const back = {};
  (q.normalized || []).forEach(x => back[x.to] = x.from);
  (q.redirects  || []).forEach(x => back[x.to] = back[x.from] || x.from);
  const out = {};
  Object.values(pages).forEach(p => {
    if(!p.thumbnail) return;
    const rec = {src:p.thumbnail.source,
      page:'https://en.wikipedia.org/wiki/' + encodeURIComponent(p.title.replace(/ /g,'_'))};
    out[p.title] = rec;
    let k = p.title, guard = 0;
    while(back[k] && guard++ < 5){ k = back[k]; out[k] = rec; }
  });
  return out;
}

async function loadPhotos(d){
  const stops = stopsOf(d).filter(s => PH[s.name] === undefined);
  if(!stops.length) return;
  stops.forEach(s => PH[s.name] = null);          // marca "pedido"
  const titled = stops.filter(s => s.wiki);
  try{
    if(titled.length){
      const j = await wq({prop:'pageimages', piprop:'thumbnail', pithumbsize:'900',
                          redirects:'1',
                          titles: [...new Set(titled.map(s=>s.wiki))].join('|')});
      const got = harvest(j);
      titled.forEach(s => { if(got[s.wiki]) PH[s.name] = got[s.wiki]; });
    }
    // los que quedaron sin foto: búsqueda por nombre, de a uno y sin bloquear
    const misses = stops.filter(s => !PH[s.name]).slice(0, 8);
    await Promise.all(misses.map(async s => {
      try{
        const j = await wq({generator:'search', gsrsearch:s.name+' Iceland', gsrlimit:'1',
                            prop:'pageimages', piprop:'thumbnail', pithumbsize:'900'});
        const got = Object.values(harvest(j))[0];
        if(got) PH[s.name] = got;
      }catch(e){}
    }));
  }catch(e){}
  renderDay(); draw();
  if(NAVi >= 0) paintSheet();
}

function photoTag(s, cls){
  const p = PH[s.name];
  if(!p) return '';
  return `<span class="${cls}"><img src="${p.src}" alt="${s.name}" loading="lazy"
     onerror="this.parentNode.style.display='none'"></span>`;
}

/* ---------- panel de parada ----------
   Reemplaza al globo de Leaflet: hay lugar para la foto grande y para el texto
   completo. NAV es la lista de paradas recorrible con las flechas: sigue el
   orden del día abierto, o todos los días encadenados si está en «TODO». */
let NAV = [], NAVi = -1;

function buildNav(){
  NAV = [];
  const days = SEL==='all' ? DAYS : [DAYS[SEL]];
  days.forEach(d => seqOf(d).forEach(s => {
    // seqOf ya devuelve el orden real del recorrido, con las sugeridas
    // intercaladas donde corresponde; los alojamientos se repiten entre días,
    // así que se agregan una sola vez.
    if(!s.isBase) NAV.push({d, s});
    else if(!NAV.some(x => x.base && x.s.name===s.name)) NAV.push({d, s, base:true});
  }));
}

const $ = id => document.getElementById(id);

function openSheet(dayN, name){
  buildNav();
  const i = NAV.findIndex(x => x.s.name===name && (x.d.n===dayN || x.base));
  if(i < 0) return;
  NAVi = i; paintSheet(); $('ov').hidden = false;
  document.body.style.overflow = 'hidden';
  $('shX').focus();
}
function closeSheet(){
  $('ov').hidden = true; NAVi = -1;
  document.body.style.overflow = '';
}
function stepSheet(dir){
  if(NAVi < 0) return;
  const n = NAVi + dir;
  if(n < 0 || n >= NAV.length) return;
  NAVi = n; paintSheet();
}

function paintSheet(){
  const {d, s, base} = NAV[NAVi];
  const col = clr(d.n-1);
  const p = PH[s.name];

  const img = $('shImg');
  if(p){
    img.className = 'on';
    // En los alojamientos la foto es del paraje, no de la cabaña: hay que decirlo.
    const cap = base && s.area ? `<span class="cap">${s.area} — foto de la zona, no del alojamiento</span>` : '';
    img.innerHTML = `<img src="${p.src}" alt="${s.name}"
      onerror="document.getElementById('shImg').className=''">` + cap;
  }
  else { img.className = ''; img.innerHTML = ''; }

  $('shDay').innerHTML = base
    ? `<span class="dot" style="background:var(--ink)"></span>Alojamiento`
    : `<span class="dot" style="background:${col}"></span>Día ${d.n} · ${d.dow} ${d.date}`;
  $('shT').textContent = s.name;

  const bits = [];
  if(base){ bits.push(s.meta); }
  else{
    bits.push(s.type);
    if(s.dur) bits.push(hm(s.dur));
    if(s.sug) bits.push('sugerido · desvío +' + s.addKm + ' km / +' + s.addMin + ' min');
    if(s.book) bits.push('a reservar');
    if(s.approx) bits.push('ubicación aprox.');
  }
  $('shMeta').textContent = bits.join(' · ');
  $('shNote').textContent = s.note || '';
  $('shTip').textContent = s.tip || '';
  $('shCount').textContent = (NAVi+1) + ' / ' + NAV.length +
    (SEL==='all' ? ' · todo el viaje' : ' · día ' + d.n);
  // addr tiene prioridad: cuando un alojamiento tenga dirección exacta, Google la
  // resuelve mejor que una coordenada aproximada.
  $('shMap').href = 'https://www.google.com/maps/search/?api=1&query=' +
    encodeURIComponent(s.addr ? s.addr : (s.lat + ',' + s.lng));
  $('shMap').textContent = base && !s.addr ? 'Buscar la zona en Google Maps' : 'Abrir en Google Maps';

  $('shP').disabled = NAVi === 0;
  $('shN').disabled = NAVi === NAV.length - 1;
  $('sheet').scrollTop = 0;
  map.panTo([s.lat, s.lng], {animate:true, duration:.5});
}

$('shX').onclick = closeSheet;
$('shP').onclick = () => stepSheet(-1);
$('shN').onclick = () => stepSheet(1);
$('ov').addEventListener('click', e => { if(e.target === $('ov')) closeSheet(); });
document.addEventListener('keydown', e => {
  if($('ov').hidden) return;
  if(e.key === 'Escape') closeSheet();
  if(e.key === 'ArrowLeft') stepSheet(-1);
  if(e.key === 'ArrowRight') stepSheet(1);
});
// deslizar horizontal en el teléfono
let tx = 0, ty = 0;
$('sheet').addEventListener('touchstart', e => {
  tx = e.changedTouches[0].clientX; ty = e.changedTouches[0].clientY;
}, {passive:true});
$('sheet').addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if(Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)*1.6) stepSheet(dx < 0 ? 1 : -1);
}, {passive:true});

  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

readDC();
const clr = i => DC[i % 9];
const hm = h => { const m = Math.round(h*60);

    {base:0},

     note:'Skaftafell es la parte accesible del Vatnajökull, el glaciar más grande de Europa, y funciona como un oasis: bosque de abedules y praderas entre lenguas de hielo. Svartifoss cae sobre un anfiteatro de columnas de basalto negro que inspiraron el techo de la iglesia Hallgrímskirkja de Reikiavik.',
     tip:'Ida y vuelta ~5,5 km, 1,5–2 h. La subida es sostenida al principio y después afloja; el sendero está bien marcado y tiene bancos. Hay centro de visitantes con baños y café. Estacionamiento pago.'},
    {name:'Jökulsárlón', wiki:'Jökulsárlón', lat:64.0784, lng:-16.2306, type:'naturaleza', dur:1,
     note:'Una laguna que no existía hace un siglo: se formó cuando el glaciar Breiðamerkurjökull empezó a retroceder. Los témpanos se desprenden, flotan azules y translúcidos, y salen al mar por un canal corto. Suele haber focas.',
     tip:'El mirador está a metros del estacionamiento, sin exigencia física. Hay salidas en bote anfibio que se reservan aparte. Estacionamiento pago.'},
    {name:'Playa de los Diamantes', wiki:'Breiðamerkursandur', lat:64.0434, lng:-16.1785, type:'naturaleza', dur:0.75,
     note:'Los témpanos que salieron al mar vuelven a la costa con la marea y quedan varados sobre arena negra, pulidos como vidrio. Cambia todos los días.',
     tip:'Cruzando la ruta 1 desde la laguna. Las olas también entran fuerte acá: no subirse a los témpanos ni acercarse a la rompiente.'},
    {base:0}],
  legs:[null,{km:70,min:50},{km:57,min:45},{km:4,min:5},{km:125,min:95}],
  extras:[
    {name:'Fjaðrárgljúfur', wiki:'Fjaðrárgljúfur', lat:63.7714, lng:-18.1721, type:'caminata', dur:1, after:0,
     addKm:14, addMin:18, note:'Un cañón de 100 m de profundidad y 2 km de largo, con paredes de musgo que serpentean. Se recorre por un sendero de borde con miradores escalonados.',
     tip:'A media hora de la cabaña y casi sobre la ruta: es el desvío más barato del viaje. Estacionamiento pago. El sendero cierra cuando el suelo está muy blando.'},
    {name:'Fjallsárlón', wiki:'Fjallsárlón', lat:63.9880, lng:-16.3800, type:'naturaleza', dur:0.75, after:1,
     addKm:4, addMin:6, note:'La laguna glaciar chica, 10 km antes de Jökulsárlón. Tiene menos témpanos pero el frente del glaciar se ve mucho más cerca, y va la décima parte de la gente.',
     tip:'Si Jökulsárlón está lleno de micros, esta compensa. En 2026 el estacionamiento seguía siendo gratis.'},
    {name:'Svínafellsjökull', wiki:'Svínafellsjökull', lat:63.9850, lng:-16.8760, type:'naturaleza', dur:0.75, after:0,
     addKm:10, addMin:20, note:'Un mirador a pocos minutos de Skaftafell sobre una lengua glaciar agrietada y sucia de ceniza, con un aspecto mucho más crudo que el hielo turístico.',
     tip:'Se llega por ripio corto. El acceso estuvo restringido en distintos momentos por riesgo de desprendimientos en la ladera: verificá el estado antes de ir.'},
    {name:'Kirkjubæjarklaustur y Systrafoss', wiki:'Kirkjubæjarklaustur', lat:63.7860, lng:-18.0620, type:'pueblo', dur:0.75, after:0,
     addKm:20, addMin:20, note:'El pueblo de referencia de la zona, con la cascada Systrafoss cayendo justo detrás de las casas y el Kirkjugólf, un "piso de iglesia" de columnas de basalto pulidas por el hielo que parece hecho a mano pero es natural.',
     tip:'El súper y la nafta más cercanos a la cabaña. Buena parada para reponer si el lunes en Vík no alcanzó.'}],
  flags:[{t:'sig',h:'El día más holgado del sur',b:'Skaftafell queda a 70 km de la cabaña y el día cierra en 8 h, así que hay margen real para el clima y para caminar sin apuro. Si el pronóstico da bien, es el día para sumar Fjaðrárgljúfur o Fjallsárlón sin que moleste.'}]},

{ n:4, dow:'Mié', date:'23 sep', title:'Círculo Dorado y noche en Skálholt', sun:'07:11 – 19:12',
  route:[
    {base:0},
    {name:'Geysir · Strokkur', wiki:'Strokkur', lat:64.3104, lng:-20.3024, type:'naturaleza', dur:1,
     note:'El Geysir original —el que le dio nombre a todos los géiseres del mundo— hoy casi no entra en erupción. El que trabaja es Strokkur, al lado: infla una burbuja azul y dispara 20–30 metros cada 5 a 10 minutos, sin fallar.',
     tip:'Senderos cortos y planos, apto para todos. Poné el viento a tu espalda antes de la erupción: el agua sale a 100 °C. Hay centro de visitantes con baños y comida.'},
    {name:'Gullfoss', wiki:'Gullfoss', lat:64.3271, lng:-20.1199, type:'naturaleza', dur:1,
     note:'El río Hvítá, alimentado por el glaciar Langjökull, cae en dos escalones dentro de un cañón de 70 m. En los años 20 casi la usan para una hidroeléctrica y la salvó la hija del dueño de la tierra amenazando con tirarse.',
     tip:'El mirador de arriba se llega sin escaleras y ya muestra los dos saltos. La pasarela de abajo tiene escalones y te empapa. Era de los pocos sitios grandes con estacionamiento todavía gratis en 2026.'},
    {name:'Secret Lagoon (Flúðir)', lat:64.1373, lng:-20.3106, type:'termas', dur:2.5, book:true,
     note:'La pileta termal más antigua del país, de 1891, cuando se usaba para enseñar a nadar a los chicos del pueblo. Agua entre 38 y 40 °C, fondo natural, vapor por todos lados y un mini géiser que descarga cada pocos minutos al costado.',
     tip:'Reserva online obligatoria. Es norma estricta ducharse desnudo en el vestuario antes de entrar; no es opcional y está señalizado. Llevá toalla o alquilala.'},
    {base:1}],
  legs:[null,{km:235,min:170},{km:10,min:10},{km:45,min:40},{km:22,min:20}],
  extras:[
    {name:'Kerið', wiki:'Kerið', lat:64.0411, lng:-20.8853, type:'naturaleza', dur:0.5, after:0,
     addKm:6, addMin:8, note:'Un cráter volcánico de 3.000 años con las paredes rojas y un lago verde opaco en el fondo. Se puede rodear por el borde o bajar por escalones hasta el agua.',
     tip:'Sobre la ruta 35 camino a Geysir. Cobra entrada por persona, no por auto. La vuelta completa por arriba son 15 minutos planos.'},
    {name:'Cascada Faxi', wiki:'Faxi', lat:64.2340, lng:-20.3320, type:'naturaleza', dur:0.5, after:0,
     addKm:6, addMin:8, note:'Una cascada ancha y baja sobre el río Tungufljót, con una escalera para salmones al costado. Nadie para acá y está a diez minutos de Geysir.',
     tip:'Parada de 20 minutos, con mesas de picnic. Buena para la vianda del mediodía.'},
    {name:'Friðheimar', lat:64.1600, lng:-20.2400, type:'comida', dur:1.5, after:2,
     addKm:10, addMin:12, note:'Un invernadero geotérmico donde se almuerza entre las plantas de tomate, con luces de crecimiento encendidas y abejorros dando vueltas. La sopa de tomate con pan casero es lo que va todo el mundo a comer.',
     tip:'Hay que reservar con anticipación, se llena. Está a 10 km de Skálholt y encaja con el horario islandés de almuerzo, entre 11:30 y 14:00.'},
    {name:'Catedral de Skálholt', wiki:'Skálholt', lat:64.1258, lng:-20.5283, type:'museo', dur:0.75, after:3,
     addKm:1, addMin:2, note:'La iglesia que marca uno de los lugares más cargados de historia de Islandia: acá funcionó la sede episcopal desde 1056 y fue el centro cultural del país hasta que un terremoto la arrasó en 1784. Abajo hay una cripta con el sarcófago de piedra de un obispo del siglo XIII y un túnel medieval excavado.',
     tip:'A 350 metros a pie de la cabaña: se puede ver a la mañana antes de arrancar, sin gastar tiempo de ruta.'}],
  flags:[{t:'sig',h:'El turno de las termas ordena el día',b:'Son 235 km hasta Geysir, así que el Círculo Dorado arranca casi tres horas después de dejar Hrífunes: la salida tiene que ser temprano. Reservá Secret Lagoon a las 16:00 o 17:00 y el día cierra solo, porque de Flúðir a Skálholt hay 20 minutos.'}]},

{ n:5, dow:'Jue', date:'24 sep', title:'Þingvellir y transición al norte', sun:'07:14 – 19:09',
  route:[
    {base:1},
    {name:'Þingvellir', wiki:'Þingvellir', lat:64.2559, lng:-21.1300, type:'caminata', dur:2,
     note:'Acá funcionó el Alþingi desde el año 930: el parlamento en funciones más antiguo del mundo, al aire libre, en una grieta que amplifica la voz. Y es el único lugar del planeta donde se camina por el borde visible entre las placas de Norteamérica y Eurasia, que se separan unos 2 cm por año.',
     tip:'El sendero Almannagjá baja suave y está pavimentado. Estacionamiento pago (~1.000 ISK, checkit.is) y los baños se cobran aparte. A 48 km de Skálholt: conviene salir temprano porque el día es largo.'},
    {name:'Hvammsvík Hot Springs', lat:64.3417, lng:-21.5806, type:'termas', dur:3, book:true,
     note:'Ocho piletas de piedra construidas sobre la costa misma del fiordo de Hvalfjörður, con temperaturas distintas y montañas alrededor. Las de abajo se llenan y vacían con la marea del Atlántico, así que la experiencia cambia según la hora.',
     tip:'Cupos deliberadamente limitados para que no se llene. Vestuarios modernos y acceso al agua cómodo, que es justo lo que buscaban para el grupo.'},
    {name:'Ytri Tunga', lat:64.8035, lng:-22.9155, type:'naturaleza', dur:0.75,
     note:'Una playa de arena dorada —rareza en esta isla— donde una colonia de focas se tira sobre las rocas a descansar. Es de los lugares más confiables de Islandia para verlas sin salir en barco.',
     tip:'Está sobre la ruta 54, no es desvío. Mejor con marea baja. Prismáticos ayudan, y hay que quedarse lejos: molestarlas está prohibido.'},
    {base:2}],
  legs:[null,{km:48,min:45},{km:58,min:50},{km:148,min:110},{km:62,min:50}],
  extras:[
    {name:'Öxarárfoss', wiki:'Öxarárfoss', lat:64.2650, lng:-21.1220, type:'caminata', dur:0.5, after:1,
     addKm:1, addMin:2, note:'La cascada de adentro de Þingvellir, al final de la grieta de Almannagjá. Se llega por pasarela de madera desde el mismo sendero.',
     tip:'Está incluida en la caminata: 15 minutos más y no hay que pagar otro estacionamiento.'},
    {name:'Borgarnes', wiki:'Borgarnes', lat:64.5383, lng:-21.9214, type:'pueblo', dur:1.5, after:2,
     addKm:2, addMin:5, note:'El pueblo bisagra entre el sur y el oeste, sobre un fiordo. Tiene el Settlement Centre, un museo chico y muy bien hecho sobre la colonización vikinga y la saga de Egill.',
     tip:'Es el punto medio natural del traslado y hay supermercado: última compra decente antes de Snæfellsnes.'},
    {name:'Gerðuberg', wiki:'Gerðuberg cliffs', lat:64.7830, lng:-22.3630, type:'naturaleza', dur:0.5, after:2,
     addKm:3, addMin:5, note:'Un paredón de cientos de columnas de basalto hexagonales, todas de la misma altura, alineadas como un muro construido. Unos 500 metros de largo.',
     tip:'A 200 m de la ruta 54, gratis y sin gente. Parada de 20 minutos que rompe bien el tramo largo.'}],
  flags:[{t:'alert',h:'Día al límite: 10 h',b:'Þingvellir, las termas de Hvammsvík, Ytri Tunga y 316 km de ruta en una sola jornada, contra 12 h de luz. Reservá Hvammsvík temprano en la tarde y no antes: si el turno cae al mediodía, no llegan a Ytri Tunga con luz. Los cupos son muy limitados y los horarios centrales se agotan primero.'}]},

{ n:6, dow:'Vie', date:'25 sep', title:'Ballenas desde Ólafsvík', sun:'07:16 – 19:05',
  route:[
    {base:2},
    {name:'Láki Tours · Ólafsvík', wiki:'Ólafsvík', lat:64.8945, lng:-23.7089, type:'reserva', dur:3.5, book:true,
     note:'Salen del puerto de Ólafsvík hacia la bahía de Breiðafjörður. En septiembre la temporada fuerte es de jorobadas, minke, calderones y delfines de pico blanco; las orcas se ven más de invierno a julio. El fondo de la escena es el glaciar Snæfellsjökull.',
     tip:'La salida son unas 3 horas de mar abierto. Pastillas para el mareo antes de subir, no cuando ya te sentís mal. Abrigo de más: en cubierta el viento aparente es brutal. Depende 100% del viento; si cancelan, reubican al día siguiente.'},
    {name:'Djúpalónssandur', wiki:'Djúpalónssandur', lat:64.7529, lng:-23.9026, type:'naturaleza', dur:1.5,
     note:'Playa de piedras negras redondas y pulidas, dentro del parque nacional Snæfellsjökull. Están tiradas las chapas oxidadas de un pesquero británico que naufragó en 1948, dejadas ahí como memorial. También quedan las cuatro piedras de levantamiento con las que se medía la fuerza de los aspirantes a marinero: la más pesada son 154 kg.',
     tip:'Se baja por el sendero Nautastígur entre paredes de lava, con escalones irregulares. El mar entra fuerte también acá. No llevarse piedras: está prohibido.'},
    {name:'Kirkjufell y Kirkjufellsfoss', wiki:'Kirkjufell', lat:64.9276, lng:-23.3106, type:'naturaleza', dur:1,
     note:'El cerro más fotografiado de Islandia, con esa forma de punta de flecha que le dio el apodo de "la montaña flecha" en Game of Thrones. La postal clásica es desde las cascadas del otro lado de la ruta, con el cerro atrás.',
     tip:'A 5 minutos del alojamiento: dejalo para el atardecer y volvés a cenar sin manejar de noche. El estacionamiento pasó a ser pago. Subir el cerro es escalada técnica con muertos en el historial: no es una caminata.'},
    {base:2}],
  legs:[null,{km:24,min:20},{km:37,min:35},{km:58,min:55},{km:3,min:5}],
  extras:[
    {name:'Bæjarfoss (Ólafsvík)', lat:64.8940, lng:-23.7050, type:'caminata', dur:0.5, after:1,
     addKm:1, addMin:3, note:'Una cascada dentro del pueblo mismo, con escalera y mirador, a cinco minutos a pie del puerto.',
     tip:'Ideal para matar el tiempo antes de que zarpe el barco, o para descomprimir al bajar.'},
    {name:'Svöðufoss', lat:64.8700, lng:-23.7500, type:'naturaleza', dur:0.5, after:1,
     addKm:8, addMin:12, note:'Cae sobre columnas de basalto y, con día claro, tiene el Snæfellsjökull justo detrás. Le hicieron pasarela y estacionamiento hace poco.',
     tip:'Acceso llano, apto para todos. Quince minutos y de vuelta al auto.'},
    {name:'Lóndrangar y Malarrif', wiki:'Lóndrangar', lat:64.7350, lng:-23.7900, type:'caminata', dur:1, after:2,
     addKm:6, addMin:10, note:'Dos agujas de basalto de 75 y 61 metros clavadas en el mar, restos del tapón de un cráter viejo. Al lado está el faro de Malarrif y el centro de visitantes del parque, con senderos costeros que unen los dos puntos.',
     tip:'A 3 km de Djúpalónssandur, prácticamente gratis en tiempo. El sendero por la loma de Svalþúfa tiene tramos empinados; el mirador de abajo es plano.'}],
  flags:[{t:'alert',h:'Láki Tours depende del viento',b:'Reservá los tickets por internet: con la reserva hecha tienen prioridad de reprogramación si el capitán cancela, cosa que quien compra en el puerto no tiene. Si cancelan, el sábado de Arnarstapi es el día con margen para reacomodarlo.'}]},

{ n:7, dow:'Sáb', date:'26 sep', title:'Acantilados de Arnarstapi', sun:'07:19 – 19:01',
  route:[
    {base:2},
    {name:'Arnarstapi', wiki:'Arnarstapi', lat:64.7676, lng:-23.6217, type:'pueblo', dur:0.5,
     note:'Un puerto pesquero diminuto al pie del Snæfellsjökull, con una estatua enorme de piedra de Bárður Snæfellsás, el medio-gigante protector de la península según la saga.',
     tip:'Arranque del sendero costero. Hay estacionamiento, baños y un café. Es el punto donde conviene dejar el auto y hacer la caminata de ida y vuelta.'},
    {name:'Sendero Arnarstapi – Hellnar', wiki:'Arnarstapi', lat:64.7616, lng:-23.6339, type:'caminata', dur:2.5,
     note:'2,5 km por lado bordeando acantilados de lava negra, con arcos de roca, bufaderos donde el mar explota hacia arriba y colonias de aves marinas. Cruza un campo de lava protegido y no tiene ni una subida seria.',
     tip:'Es el mejor trekking del viaje para este grupo: espectacular y completamente llano. El borde no tiene baranda en varios tramos y el viento empuja: mantenerse del lado de tierra del sendero.'},
    {name:'Hellnar', wiki:'Hellnar', lat:64.7556, lng:-23.6461, type:'pueblo', dur:0.5,
     note:'La otra punta del sendero, otro caserío de pescadores con una cueva marina, Baðstofa, donde la luz cambia de color según la hora.',
     tip:'Hay un café con vista al mar, pero en septiembre puede estar cerrado: verificá antes de contar con él para el almuerzo.'},
    {base:2}],
  legs:[null,{km:48,min:45},{km:1,min:3},{km:6,min:9},{km:52,min:50}],
  extras:[
    {name:'Rauðfeldsgjá', wiki:'Rauðfeldsgjá', lat:64.7896, lng:-23.5117, type:'caminata', dur:0.75, after:0,
     addKm:3, addMin:5, note:'Una grieta angosta que se mete derecho adentro de la montaña, tan cerrada que desde la ruta parece un tajo. Adentro el arroyo corre por el piso y la luz baja filtrada desde muy arriba.',
     tip:'Justo sobre la ruta 574. Los primeros metros son fáciles y ya valen la pena; más adentro hay que pisar el agua y trepar piedras mojadas. Se puede entrar solo un poco y volver.'},
    {name:'Gatklettur', lat:64.7690, lng:-23.6270, type:'naturaleza', dur:0.25, after:1,
     addKm:0, addMin:0, note:'El arco de piedra circular sobre el mar, en el borde de Arnarstapi. Es la foto que todos conocen de la península.',
     tip:'Está sobre el sendero, a metros del estacionamiento: no cuesta nada de tiempo extra.'},
    {name:'Búðakirkja', wiki:'Búðir', lat:64.8215, lng:-23.3856, type:'naturaleza', dur:0.5, after:3,
     addKm:8, addMin:10, note:'Una iglesia de madera pintada de negro, sola en medio de un campo de lava cubierto de musgo, con el cementerio cercado alrededor. Reconstruida en 1987 según la original de 1848.',
     tip:'Camino a la base. Se ve todo desde afuera en 20 minutos; el interior casi nunca está abierto.'},
    {name:'Bjarnarfoss', lat:64.8230, lng:-23.3900, type:'naturaleza', dur:0.5, after:3,
     addKm:2, addMin:4, note:'Una cascada alta y fina que cae por un paredón de basalto justo arriba de Búðir, visible desde la ruta.',
     tip:'Tiene pasarela y mirador nuevos. Se combina con Búðakirkja en la misma parada.'}],
  flags:[{t:'sig',h:'El día colchón',b:'Poco más de 5 h con el plan base, y es el único día del viaje con aire de sobra. Sirve para reacomodar el avistaje si el viernes lo cancelan por viento, o para descansar las piernas y sumar dos o tres de las sugeridas.'}]},

{ n:8, dow:'Dom', date:'27 sep', title:'Cráteres y costa oeste', sun:'07:22 – 18:57',
  route:[
    {base:2},
    {name:'Cráter Saxhóll', wiki:'Saxhóll', lat:64.8586, lng:-23.8069, type:'caminata', dur:1,
     note:'Un cono de escoria roja de unos 3.000 años, con el cráter abierto arriba y vista al campo de lava que largó, al glaciar y al mar. Le construyeron una escalera metálica en zigzag que sube todo el cono.',
     tip:'Es la forma más accesible del viaje de pararse en el borde de un cráter: 5 a 10 minutos de escalera con descansos. Arriba pega mucho viento.'},
    {name:'Faro de Svörtuloft', wiki:'Öndverðarnes', lat:64.8724, lng:-24.0480, type:'naturaleza', dur:1.5,
     note:'Un faro naranja chillón sobre acantilados negros cortados a pico, en la punta más occidental de la península. El contraste de color y la ausencia total de vegetación le dan un aire lunar. Abajo rompe el Atlántico sin nada que lo frene.',
     tip:'Los últimos kilómetros son de ripio con piedra suelta: despacio, y ojo con la pintura. No hay servicios ni señal. Cerca del borde no hay baranda.'},
    {base:2}],
  legs:[null,{km:55,min:50},{km:22,min:30},{km:76,min:75}],
  extras:[
    {name:'Hellissandur', wiki:'Hellissandur', lat:64.9160, lng:-23.8100, type:'pueblo', dur:0.75, after:0,
     addKm:3, addMin:5, note:'El pueblo más antiguo de pescadores de la península, convertido en galería a cielo abierto: los murales cubren galpones, tanques y paredones enteros. También está la antena de radio más alta de Europa occidental.',
     tip:'Se recorre en auto y a pie en media hora. Sirve de plan B si el viento arruina la costa expuesta.'},
    {name:'Skarðsvík', lat:64.8656, lng:-23.9752, type:'naturaleza', dur:0.75, after:2,
     addKm:10, addMin:15, note:'Una playa de arena dorada encajada entre paredones de lava negra, con el agua de un turquesa que no parece del Atlántico Norte. Es una rareza geológica en esta costa. Cerca apareció una tumba vikinga.',
     tip:'Al lado de Svörtuloft. La bajada a la arena es corta pero irregular.'},
    {name:'Öndverðarnes', wiki:'Öndverðarnes', lat:64.8880, lng:-24.0400, type:'naturaleza', dur:0.75, after:2,
     addKm:6, addMin:15, note:'La punta extrema de la península, con un faro chiquito naranja y Fálki, un pozo de agua de piedra usado desde la época vikinga. Se ven aves marinas y a veces ballenas desde tierra.',
     tip:'Camino de ripio angosto y con pozos: manejá muy despacio. Si el auto no es alto, evaluá dejarlo.'},
    {name:'Cueva Vatnshellir', wiki:'Vatnshellir', lat:64.7495, lng:-23.8180, type:'reserva', dur:1, after:2,
     addKm:12, addMin:15, note:'Un tubo de lava de 8.000 años que baja 35 metros por tres cámaras, con formaciones y colores minerales. Es la cueva que Julio Verne eligió como entrada en "Viaje al centro de la Tierra". En el punto más profundo apagan las luces.',
     tip:'Visita guiada de 45 minutos, casco y linterna incluidos, sobre la ruta 574 con estacionamiento propio. Se baja por escalera caracol de 35 m: es el punto a evaluar para el grupo. Hay tarifa reducida para mayores.'}],
  flags:[{t:'sig',h:'Última noche de auroras',b:'El día es corto, poco más de 5 h. Conviene volver con luz, cenar temprano y dejar la noche libre: es la última chance de salir al porche si la app marca actividad, y Grundarfjörður tiene poca contaminación lumínica.'}]},

{ n:9, dow:'Lun', date:'28 sep', title:'Reikiavik, Reykjanes y vuelo', sun:'07:25 – 18:54',
  route:[
    {base:2},

/* ---------- cálculo por día ---------- */
function calc(d, withSug){
  let act = 0;
  seqOf(d, withSug).forEach(s=>{ if(!s.isBase) act += s.dur||0; });
  const r = RT[rtKey(d, withSug)];
  if(r && r.ok){
    const km  = r.legs.reduce((a,l)=>a+l.km, 0);
    const drv = r.legs.reduce((a,l)=>a+l.h, 0);
    return {km, drv, act, tot:drv+act, routed:true};
  }
  let km = 0, min = 0;
  d.route.forEach((s,i)=>{ if(d.legs[i]){ km += d.legs[i].km; min += d.legs[i].min; } });
  if(withSug) d.extras.forEach(x=>{ km += x.addKm; min += x.addMin; });
  return {km, drv:min/60, act, tot:min/60+act, routed:false};
}

/* Mapa base dibujado en el propio archivo: no depende de tiles externos. */
const landStyle = () => ({color:cssv('--coast'), weight:1, fillColor:cssv('--land'), fillOpacity:1, interactive:false});

let SEL='all', SUG=false, ROUTE=true;
const THR=10, SCALE=12, BARH=115;

/* ---------- ruteo real ----------
   Las líneas siguen las calles consultando OSRM (router.project-osrm.org) desde
   el navegador. Si el pedido falla —sin red, o bloqueado por el visor— cae de
   vuelta a las líneas rectas punteadas y a mis distancias estimadas, y lo avisa
   en el panel. Nunca dibuja una traza inventada. */
const RT = {};                 // cache: "día|sug" -> {ok, geom, legs}
let RTSTATE = 'pending';       // pending | ok | partial | fail

function rtKey(d, sug){ return d.n + '|' + (sug ? 1 : 0); }

async function fetchRoute(d, sug){
  const k = rtKey(d, sug);
  if(RT[k]) return RT[k];
  const seq = seqOf(d, sug);
  const co = seq.map(s => s.lng.toFixed(5)+','+s.lat.toFixed(5)).join(';');
  const url = 'https://router.project-osrm.org/route/v1/driving/'+co+
              '?overview=full&geometries=geojson';
  try{
    const res = await fetch(url, {mode:'cors'});
    const j = await res.json();
    if(j.code !== 'Ok' || !j.routes || !j.routes.length) throw new Error(j.code||'sin ruta');
    const r = j.routes[0];
    if(r.legs.length !== seq.length-1) throw new Error('tramos desalineados');
    RT[k] = {ok:true,
      geom: r.geometry.coordinates.map(c => [c[1], c[0]]),
      legs: r.legs.map(l => ({km:l.distance/1000, h:l.duration/3600}))};
  }catch(e){ RT[k] = {ok:false, err:String(e.message||e)}; }
  return RT[k];
}

async function loadRoutes(sug){
  const res = await Promise.all(DAYS.map(d => fetchRoute(d, sug)));
  const ok = res.filter(r => r.ok).length;
  RTSTATE = ok === res.length ? 'ok' : (ok ? 'partial' : 'fail');
  buildLoad(); renderDay(); draw(); setRtBadge();
}

function setRtBadge(){
  const el = document.getElementById('rtb');
  if(!el) return;
  const m = {
    pending:['calculando rutas reales…','var(--dimmer)'],
    ok:     ['tramos ruteados sobre calles reales · OSRM','var(--ok)'],
    partial:['algunos tramos ruteados; el resto, estimado','var(--signal)'],
    fail:   ['sin acceso al ruteador: líneas rectas y km estimados','var(--signal)']
  }[RTSTATE];
  el.textContent = m[0]; el.style.color = m[1];
}

/* recorrido efectivo del día: route con extras insertados si SUG está activo */
function seqOf(d, sug){
  if(sug===undefined) sug = SUG;
  const out=[];
  d.route.forEach((s,i)=>{
    out.push(s.base!==undefined ? {...BASES[s.base], isBase:true} : s);
    if(sug) d.extras.filter(x=>x.after===i).forEach(x=> out.push({...x, sug:true}));
  });
  return out;
}

function draw(){
  lStops.clearLayers(); lLines.clearLayers();
  const days = SEL==='all' ? DAYS : [DAYS[SEL]];
  const pts = [];
  days.forEach(d=>{
    const c = clr(d.n-1), seq = seqOf(d);
    const r = RT[rtKey(d, SUG)];
    if(ROUTE && seq.length>1){
      if(r && r.ok){
        L.polyline(r.geom, {color:'#0d1014', weight:5.5, opacity:.55}).addTo(lLines);
        L.polyline(r.geom, {color:c, weight:2.8, opacity:.95}).addTo(lLines);
      }else{
        L.polyline(seq.map(s=>[s.lat,s.lng]),
          {color:c, weight:2.2, opacity:.6, dashArray:'6,7'}).addTo(lLines);
      }
    }
    let k=0;
    seq.forEach(s=>{
      if(s.isBase) return;
      k++;
      const id = d.n+'|'+s.name;
      const m = L.marker([s.lat,s.lng],{icon:L.divIcon({className:'', iconSize:[23,23],
        iconAnchor:[11.5,11.5], html:`<div class="mk" style="width:23px;height:23px;background:${c};
          ${s.sug?'opacity:.62;border:1.5px dashed #12151a':''}">${k}</div>`})})
        .on('click', () => openSheet(d.n, s.name)).addTo(lStops);
      mIdx[id]=m; pts.push([s.lat,s.lng]);
    });
  });
  BASES.forEach(b=>pts.push([b.lat,b.lng]));
  if(pts.length) map.flyToBounds(L.latLngBounds(pts).pad(.16),{duration:.6});
}

function buildLoad(){
  const el=document.getElementById('load'); el.innerHTML='';
  DAYS.forEach(d=>{
    const c=calc(d,SUG), col=clr(d.n-1);
    const b=document.createElement('button');
    b.className='lcol'; b.setAttribute('aria-pressed', String(SEL===d.n-1));
    b.title=`Día ${d.n} · ${hm(c.drv)} manejo + ${hm(c.act)} actividad`;
    b.innerHTML=`<div class="bars" style="height:${Math.min(c.tot/SCALE*100,100)}%">
        <div class="b-act" style="flex:${c.act};background:${col}"></div>
        <div class="b-drv" style="flex:${c.drv}"></div>
      </div><span class="lbl">${d.n}</span>`;
    b.onclick=()=>select(d.n-1);
    el.appendChild(b);
  });
  const t=document.createElement('div');
  t.className='thr'; t.style.bottom=(19+(THR/SCALE)*BARH)+'px';
  t.innerHTML='<b>10 h</b>'; el.appendChild(t);
}

function buildTabs(){
  const el=document.getElementById('tabs'); el.innerHTML='';
  const mk=(lbl,val,sub)=>{ const b=document.createElement('button');
    b.className='tab'; b.setAttribute('aria-pressed',String(SEL===val));
    b.innerHTML = lbl + (sub?`<span class="tdate">${sub}</span>`:'');
    if(val!=='all' && SEL===val) b.style.color=clr(val);
    b.onclick=()=>select(val); return b; };
  el.appendChild(mk('TODO','all','9 días'));
  DAYS.forEach(d=> el.appendChild(mk(String(d.n), d.n-1, d.dow+' '+d.date.replace(' sep',''))));
  // en teléfono, dejar visible la pestaña activa
  const act = el.querySelector('[aria-pressed="true"]');
  if(act && el.scrollWidth > el.clientWidth)
    act.scrollIntoView({block:'nearest', inline:'center'});
}

function renderDay(){

    el.innerHTML=`<h2 class="dtitle">Los nueve días</h2>
      <div class="ddate">Dom 20 → Lun 28 sep · 3 bases · 8 noches</div>
      <div class="stats">
        <div class="stat"><b>${Math.round(t.km).toLocaleString('es-AR')}</b><span>km</span></div>
        <div class="stat"><b>${Math.round(t.drv)} h</b><span>al volante</span></div>
        <div class="stat"><b>${Math.round(t.act)} h</b><span>actividad</span></div>
      </div>
      <div class="warn sig"><strong>Reservas pendientes</strong>
        Láki Tours para el avistaje del viernes, y las tres termas: Secret Lagoon el miércoles,
        Hvammsvík el jueves y Blue Lagoon el lunes. Las cuatro exigen reserva online y los cupos
        son limitados. Hvammsvík y Blue Lagoon son las más urgentes.</div>
      <div class="warn"><strong>Los dos días pesados</strong>
        El lunes 28 pide 11 h con el vuelo a las 00:20, y el jueves 24 llega justo a 10 h entre
        Þingvellir, las termas y el traslado a Snæfellsnes. El sábado 26 tiene medio día libre
        y es el colchón del viaje.</div>
      <p class="note" style="margin-top:14px">Tocá un día para ver paradas, tramos y notas. Tocá cualquier parada, en la lista o en el mapa, para abrir la ficha con foto y pasar de una a otra con las flechas.</p>`;
    return;
  }

  const d=DAYS[SEL], c=calc(d,SUG), col=clr(d.n-1);
  let h=`<h2 class="dtitle">${d.title}</h2>
    <div class="ddate"><span class="dot" style="background:${col}"></span>
      Día ${d.n} · ${d.dow} ${d.date} · luz ${d.sun}</div>
    <div class="stats">
      <div class="stat"><b>${Math.round(c.km)}</b><span>km</span></div>
      <div class="stat"><b style="color:${c.drv>4?'var(--signal)':'inherit'}">${hm(c.drv)}</b><span>manejo</span></div>
      <div class="stat"><b style="color:${c.tot>THR?'var(--alert)':'inherit'}">${hm(c.tot)}</b><span>día total</span></div>
    </div>`;
  d.flags.forEach(f=> h+=`<div class="warn ${f.t==='sig'?'sig':''}"><strong>${f.h}</strong>${f.b}</div>`);
  h+=`<div class="sect-t" style="margin:17px 0 5px">Recorrido <em>tramos estimados</em></div>`;
  if(SUG && d.extras.length)
    h+=`<div class="menu">Las sugeridas son un menú, no un plan: elegí una o dos por día. Sumadas todas, ${d.extras.length===1?'la parada agrega':'las '+d.extras.length+' agregan'} ${hm(d.extras.reduce((a,x)=>a+x.dur+x.addMin/60,0))} al día.</div>`;

  const rr = RT[rtKey(d, SUG)];
  let k=0, li=0;
  d.route.forEach((s,i)=>{
    const lg=d.legs[i];
    if(lg){
      const rl = rr && rr.ok ? rr.legs[li] : null;
      h += rl
        ? `<div class="leg-row">↓ <b>${rl.km.toFixed(0)} km</b> · ${Math.round(rl.h*60)} min <span class="rt">ruteado</span></div>`
        : `<div class="leg-row">↓ <b>${lg.km} km</b> · ${lg.min} min <span style="opacity:.6">estimado</span></div>`;
      li++;
    }
    if(s.base!==undefined){
      const b=BASES[s.base];
      h+=`<button class="stop" data-bname="${b.name}" data-lat="${b.lat}" data-lng="${b.lng}"><span class="pin base">⌂</span>
        <span><span class="nm">${b.name}</span><span class="mt">Alojamiento · ${b.meta}</span>${b.tip?`<span class="tp">${b.tip}</span>`:''}</span>${photoTag(b,'ph')}</button>`;
    }else{
      k++;
      h+=`<button class="stop" data-id="${d.n}|${s.name}" data-lat="${s.lat}" data-lng="${s.lng}">
        <span class="pin" style="background:${col}">${k}</span><span>
        <span class="nm">${s.name}${s.book?'<span class="tg res">a reservar</span>':''}</span>
        <span class="mt">${s.type} · ${hm(s.dur)}${s.approx?' · ubicación aprox.':''}</span>
        <span class="nt">${s.note}</span>
        ${s.tip?`<span class="tp">${s.tip}</span>`:''}</span>${photoTag(s,'ph')}</button>`;
    }
    if(SUG) d.extras.filter(x=>x.after===i).forEach(x=>{
      k++;
      if(rr && rr.ok && rr.legs[li]){
        h+=`<div class="leg-row">↓ <b>${rr.legs[li].km.toFixed(0)} km</b> · ${Math.round(rr.legs[li].h*60)} min <span class="rt">ruteado</span></div>`;
        li++;
      }
      h+=`<button class="stop ex" data-id="${d.n}|${x.name}" data-lat="${x.lat}" data-lng="${x.lng}">
        <span class="pin sug">${k}</span><span>
        <span class="nm">${x.name}<span class="tg sug">sugerido</span></span>
        <span class="mt">${x.type} · ${hm(x.dur)} · desvío +${x.addKm} km / +${x.addMin} min</span>
        <span class="nt">${x.note}</span>
        ${x.tip?`<span class="tp">${x.tip}</span>`:''}</span>${photoTag(x,'ph')}</button>`;
    });
  });

  el.innerHTML=h;
  el.querySelectorAll('.stop').forEach(btn=> btn.onclick=()=>{
    const id = btn.dataset.id;
    if(id){ const [dn, nm] = id.split('|'); openSheet(+dn, nm); }
    else { openSheet(null, btn.dataset.bname); }
  });
}

/* ---------- fotos ----------
   Vienen de Wikipedia / Wikimedia Commons, que tienen licencia libre, y se piden
   desde el navegador al abrir cada día. No van incrustadas en el archivo: sin red
   simplemente no aparecen, y el resto del mapa funciona igual.
   Se pide una tanda por día con los títulos exactos; los que no resuelven caen a
   una búsqueda por nombre. */
const PH = {};                       // nombre de parada -> {src, page} | null
const WAPI = 'https://en.wikipedia.org/w/api.php';

function stopsOf(d){
  // incluye los alojamientos del día: son el arranque y el cierre del recorrido
  // y también se navegan con las flechas.
  const bases = d.route.filter(s => s.base!==undefined).map(s => BASES[s.base]);
  return d.route.filter(s => s.base===undefined).concat(d.extras || [], bases);
}

async function wq(params){
  const u = WAPI + '?' + new URLSearchParams(
    Object.assign({action:'query', format:'json', origin:'*'}, params));
  const r = await fetch(u);
  return r.json();
}

function harvest(j){
  const q = j.query || {}, pages = q.pages || {};
  // Wikipedia devuelve el título final; hay que rastrear normalizaciones y
  // redirecciones para volver al título que pedimos.
  const back = {};
  (q.normalized || []).forEach(x => back[x.to] = x.from);
  (q.redirects  || []).forEach(x => back[x.to] = back[x.from] || x.from);
  const out = {};
  Object.values(pages).forEach(p => {
    if(!p.thumbnail) return;
    const rec = {src:p.thumbnail.source,
      page:'https://en.wikipedia.org/wiki/' + encodeURIComponent(p.title.replace(/ /g,'_'))};
    out[p.title] = rec;
    let k = p.title, guard = 0;
    while(back[k] && guard++ < 5){ k = back[k]; out[k] = rec; }
  });
  return out;
}

async function loadPhotos(d){
  const stops = stopsOf(d).filter(s => PH[s.name] === undefined);
  if(!stops.length) return;
  stops.forEach(s => PH[s.name] = null);          // marca "pedido"
  const titled = stops.filter(s => s.wiki);
  try{
    if(titled.length){
      const j = await wq({prop:'pageimages', piprop:'thumbnail', pithumbsize:'900',
                          redirects:'1',
                          titles: [...new Set(titled.map(s=>s.wiki))].join('|')});
      const got = harvest(j);
      titled.forEach(s => { if(got[s.wiki]) PH[s.name] = got[s.wiki]; });
    }
    // los que quedaron sin foto: búsqueda por nombre, de a uno y sin bloquear
    const misses = stops.filter(s => !PH[s.name]).slice(0, 8);
    await Promise.all(misses.map(async s => {
      try{
        const j = await wq({generator:'search', gsrsearch:s.name+' Iceland', gsrlimit:'1',
                            prop:'pageimages', piprop:'thumbnail', pithumbsize:'900'});
        const got = Object.values(harvest(j))[0];
        if(got) PH[s.name] = got;
      }catch(e){}
    }));
  }catch(e){}
  renderDay(); draw();
  if(NAVi >= 0) paintSheet();
}

function photoTag(s, cls){
  const p = PH[s.name];
  if(!p) return '';
  return `<span class="${cls}"><img src="${p.src}" alt="${s.name}" loading="lazy"
     onerror="this.parentNode.style.display='none'"></span>`;
}

/* ---------- panel de parada ----------
   Reemplaza al globo de Leaflet: hay lugar para la foto grande y para el texto
   completo. NAV es la lista de paradas recorrible con las flechas: sigue el
   orden del día abierto, o todos los días encadenados si está en «TODO». */
let NAV = [], NAVi = -1;

function buildNav(){
  NAV = [];
  const days = SEL==='all' ? DAYS : [DAYS[SEL]];
  days.forEach(d => seqOf(d).forEach(s => {
    // seqOf ya devuelve el orden real del recorrido, con las sugeridas
    // intercaladas donde corresponde; los alojamientos se repiten entre días,
    // así que se agregan una sola vez.
    if(!s.isBase) NAV.push({d, s});
    else if(!NAV.some(x => x.base && x.s.name===s.name)) NAV.push({d, s, base:true});
  }));
}

const $ = id => document.getElementById(id);

function openSheet(dayN, name){
  buildNav();
  const i = NAV.findIndex(x => x.s.name===name && (x.d.n===dayN || x.base));
  if(i < 0) return;
  NAVi = i; paintSheet(); $('ov').hidden = false;
  document.body.style.overflow = 'hidden';
  $('shX').focus();
}
function closeSheet(){
  $('ov').hidden = true; NAVi = -1;
  document.body.style.overflow = '';
}
function stepSheet(dir){
  if(NAVi < 0) return;
  const n = NAVi + dir;
  if(n < 0 || n >= NAV.length) return;
  NAVi = n; paintSheet();
}

function paintSheet(){
  const {d, s, base} = NAV[NAVi];
  const col = clr(d.n-1);
  const p = PH[s.name];

  const img = $('shImg');
  if(p){
    img.className = 'on';
    // En los alojamientos la foto es del paraje, no de la cabaña: hay que decirlo.
    const cap = base && s.area ? `<span class="cap">${s.area} — foto de la zona, no del alojamiento</span>` : '';
    img.innerHTML = `<img src="${p.src}" alt="${s.name}"
      onerror="document.getElementById('shImg').className=''">` + cap;
  }
  else { img.className = ''; img.innerHTML = ''; }

  $('shDay').innerHTML = base
    ? `<span class="dot" style="background:var(--ink)"></span>Alojamiento`
    : `<span class="dot" style="background:${col}"></span>Día ${d.n} · ${d.dow} ${d.date}`;
  $('shT').textContent = s.name;

  const bits = [];
  if(base){ bits.push(s.meta); }
  else{
    bits.push(s.type);
    if(s.dur) bits.push(hm(s.dur));
    if(s.sug) bits.push('sugerido · desvío +' + s.addKm + ' km / +' + s.addMin + ' min');
    if(s.book) bits.push('a reservar');
    if(s.approx) bits.push('ubicación aprox.');
  }
  $('shMeta').textContent = bits.join(' · ');
  $('shNote').textContent = s.note || '';
  $('shTip').textContent = s.tip || '';
  $('shCount').textContent = (NAVi+1) + ' / ' + NAV.length +
    (SEL==='all' ? ' · todo el viaje' : ' · día ' + d.n);
  // addr tiene prioridad: cuando un alojamiento tenga dirección exacta, Google la
  // resuelve mejor que una coordenada aproximada.
  $('shMap').href = 'https://www.google.com/maps/search/?api=1&query=' +
    encodeURIComponent(s.addr ? s.addr : (s.lat + ',' + s.lng));
  $('shMap').textContent = base && !s.addr ? 'Buscar la zona en Google Maps' : 'Abrir en Google Maps';

  $('shP').disabled = NAVi === 0;
  $('shN').disabled = NAVi === NAV.length - 1;
  $('sheet').scrollTop = 0;
  map.panTo([s.lat, s.lng], {animate:true, duration:.5});
}

$('shX').onclick = closeSheet;
$('shP').onclick = () => stepSheet(-1);
$('shN').onclick = () => stepSheet(1);
$('ov').addEventListener('click', e => { if(e.target === $('ov')) closeSheet(); });
document.addEventListener('keydown', e => {
  if($('ov').hidden) return;
  if(e.key === 'Escape') closeSheet();
  if(e.key === 'ArrowLeft') stepSheet(-1);
  if(e.key === 'ArrowRight') stepSheet(1);
});
// deslizar horizontal en el teléfono
let tx = 0, ty = 0;
$('sheet').addEventListener('touchstart', e => {
  tx = e.changedTouches[0].clientX; ty = e.changedTouches[0].clientY;
}, {passive:true});
$('sheet').addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if(Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)*1.6) stepSheet(dx < 0 ? 1 : -1);
}, {passive:true});

/* ---------- temas ----------
   El cambio toca tres capas: las variables CSS (automático), los colores por día
   que el JS lee de esas variables, y los estilos de las capas del mapa base, que
   Leaflet fija al crearlas y hay que reasignar a mano. */
function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  document.querySelectorAll('#themer button').forEach(b =>
    b.setAttribute('aria-pressed', String(b.dataset.t === t)));
  requestAnimationFrame(()=>{
    readDC();
    if(baseLand.setStyle){
      baseLand.setStyle(landStyle()); baseGlac.setStyle(glacStyle()); baseRoad.setStyle(roadStyle());
    }
    buildTabs(); buildLoad(); renderDay(); draw();
  });
}
document.querySelectorAll('#themer button').forEach(b =>
  b.onclick = () => applyTheme(b.dataset.t));

/* ---------- ajustes de teléfono ---------- */
const MQ = window.matchMedia('(max-width:900px)');

// Leaflet necesita recalcular el tamaño cuando cambia el alto del contenedor
// (barra de direcciones de Android, rotación, cambio de layout).
/* Si por cualquier motivo el contenedor queda sin alto (iframes que se
   dimensionan por contenido, unidades de viewport que colapsan), se lo
   imponemos en píxeles para que el mapa nunca quede invisible. */
function ensureMapHeight(){
  const el = document.getElementById('map');
  const wrap = document.getElementById('mapwrap');
  if(!el) return;
  if(el.clientHeight < 120){
    const px = MQ.matches ? 440 : Math.max(360, Math.round(window.innerHeight || 640));
    wrap.style.height = px + 'px';
    el.style.height = px + 'px';
  }
  if(map.invalidateSize) map.invalidateSize();
}
function resize(){ setTimeout(ensureMapHeight, 120); }
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', resize);
if(MQ.addEventListener) MQ.addEventListener('change', resize);

// El scroll de una página larga y el paneo del mapa se pelean por el mismo dedo:
// desactivar el zoom por rueda evita que el mapa se coma el scroll.
if(MQ.matches && map.scrollWheelZoom) map.scrollWheelZoom.disable();

// Botón flotante para volver al mapa una vez que quedó arriba.
const toMap = document.getElementById('tomap');
toMap.onclick = ()=>{
  document.getElementById('mapwrap').scrollIntoView({behavior:'smooth', block:'start'});
};
function onScroll(){
  if(!MQ.matches) return;
  const mw = document.getElementById('mapwrap').getBoundingClientRect();
  toMap.classList.toggle('on', mw.bottom < 60);
}
window.addEventListener('scroll', onScroll, {passive:true});

// Al elegir un día en el teléfono, llevar la vista al detalle sin perder el mapa.
const _select = select;
select = function(v){
  _select(v);
  if(MQ.matches) setTimeout(()=>{ if(map.invalidateSize) map.invalidateSize(); }, 150);
};

buildTabs(); buildLoad(); renderDay(); draw(); setRtBadge(); onScroll();
DAYS.forEach((d,i)=> setTimeout(()=>loadPhotos(d), 300 + i*220));  // escalonado, sin saturar
// El alto se revisa varias veces: al armar, al terminar de cargar y cuando el
// navegador móvil termina de acomodar su barra de direcciones.
ensureMapHeight();
[100, 400, 1200].forEach(ms => setTimeout(ensureMapHeight, ms));
window.addEventListener('load', ensureMapHeight);
loadRoutes(false);
</script>
